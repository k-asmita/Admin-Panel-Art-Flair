<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal Login | Art Flair - Sabahz Trading</title>
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body style="margin: 0; padding: 0; background: var(--admin-sidebar-bg);">

  <div class="admin-login-wrapper">
    <div class="admin-login-card">
      
      <!-- Brand Header -->
      <div class="admin-login-header">
        <div class="admin-login-brand-icon">AF</div>
        <h1 class="admin-login-title">Atelier Admin Portal</h1>
        <p class="admin-login-subtitle">Master operations & catalog management for Sabahz Trading</p>
      </div>

      <!-- Admin Login Form -->
      <form id="admin-login-form" novalidate>
        <!-- User ID / Email Input -->
        <div class="admin-form-group">
          <label class="admin-form-label" for="admin-email">
            Administrator User ID / Email <span style="color: var(--admin-red);">*</span>
          </label>
          <input 
            type="email" 
            id="admin-email" 
            class="admin-form-control" 
            placeholder="Enter administrator email" 
            required 
            autocomplete="off"
            autofocus
          />
        </div>

        <!-- Password Input -->
        <div class="admin-form-group">
          <label class="admin-form-label" for="admin-password">
            Administrator Password <span style="color: var(--admin-red);">*</span>
          </label>
          <input 
            type="password" 
            id="admin-password" 
            class="admin-form-control" 
            placeholder="••••••••" 
            required 
            autocomplete="current-password"
          />
        </div>

        <!-- Remember Session -->
        <div class="admin-form-group" style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px;">
          <label style="display: flex; align-items: center; gap: 8px; font-size: 0.82rem; color: var(--admin-text-secondary); cursor: pointer;">
            <input type="checkbox" id="admin-remember" />
            <span>Keep administrator session active</span>
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="admin-login-btn" id="btn-admin-submit">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          Authenticate & Access Admin Panel
        </button>
      </form>

      <!-- Store Return Link -->
      <div style="text-align: center; margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--admin-border-light); font-size: 0.84rem;">
        <a href="../index.html" style="color: var(--admin-text-secondary); text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;">
          ← Return to Public Art Flair Storefront
        </a>
      </div>

    </div>
  </div>

  <!-- Scripts -->
  <script src="../js/config.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/admin-common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // If already logged in as admin, redirect directly to dashboard
      if (AdminAuth.isAuthenticated()) {
        window.location.href = 'dashboard.html';
        return;
      }

      const form = document.getElementById('admin-login-form');
      const emailInput = document.getElementById('admin-email');
      const passInput = document.getElementById('admin-password');
      const rememberInput = document.getElementById('admin-remember');
      const submitBtn = document.getElementById('btn-admin-submit');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = emailInput.value.trim();
        const password = passInput.value;
        const rememberMe = rememberInput ? rememberInput.checked : false;

        if (!email || !password) {
          AdminAuth.showRestrictionModal();
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = `<span>Verifying credentials...</span>`;

        try {
          await AdminAuth.login(email, password, rememberMe);
          // Redirect to dashboard on success
          window.location.href = 'dashboard.html';
        } catch (err) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = `
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            Authenticate & Access Admin Panel
          `;
        }
      });
    });
  </script>
</body>
</html>
